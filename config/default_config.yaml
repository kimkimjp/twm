general:
  mod_key: "Alt"
  gaps:
    inner: 5
    outer: 10
  terminal: "wt.exe"

keybindings:
  - key: "Mod+H"
    command: "focus left"
  - key: "Mod+J"
    command: "focus down"
  - key: "Mod+K"
    command: "focus up"
  - key: "Mod+L"
    command: "focus right"
  - key: "Mod+Shift+H"
    command: "move left"
  - key: "Mod+Shift+J"
    command: "move down"
  - key: "Mod+Shift+K"
    command: "move up"
  - key: "Mod+Shift+L"
    command: "move right"
  - key: "Mod+1"
    command: "workspace 1"
  - key: "Mod+2"
    command: "workspace 2"
  - key: "Mod+3"
    command: "workspace 3"
  - key: "Mod+4"
    command: "workspace 4"
  - key: "Mod+5"
    command: "workspace 5"
  - key: "Mod+6"
    command: "workspace 6"
  - key: "Mod+7"
    command: "workspace 7"
  - key: "Mod+8"
    command: "workspace 8"
  - key: "Mod+9"
    command: "workspace 9"
  - key: "Mod+Shift+1"
    command: "move_to_workspace 1"
  - key: "Mod+Shift+2"
    command: "move_to_workspace 2"
  - key: "Mod+Shift+3"
    command: "move_to_workspace 3"
  - key: "Mod+Shift+4"
    command: "move_to_workspace 4"
  - key: "Mod+Shift+5"
    command: "move_to_workspace 5"
  - key: "Mod+Shift+6"
    command: "move_to_workspace 6"
  - key: "Mod+Shift+7"
    command: "move_to_workspace 7"
  - key: "Mod+Shift+8"
    command: "move_to_workspace 8"
  - key: "Mod+Shift+9"
    command: "move_to_workspace 9"
  - key: "Mod+Shift+Q"
    command: "close"
  - key: "Mod+F"
    command: "fullscreen"
  - key: "Mod+V"
    command: "split_toggle"
  - key: "Mod+Return"
    command: "exec wt.exe"
  - key: "Mod+Shift+E"
    command: "exit"
  - key: "Mod+Shift+C"
    command: "reload"

window_rules:
  - class: "TaskManagerWindow"
    command: "floating"
  - title: "Calculator"
    command: "floating"
