# twm - Auto-Tiling Window Manager Configuration
# Place this file at: %APPDATA%\twm\config.yaml

gaps:
  inner: 5    # Gap between windows (pixels)
  outer: 10   # Gap between windows and screen edge (pixels)

window_rules:
  - class: "TaskManagerWindow"
    command: "floating"
  - title: "Calculator"
    command: "floating"
